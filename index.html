<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="overlay">
      <svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
        <rect fill="#FFFFFF" width="24" height="24" />
        <defs>
          <linearGradient
            id="a"
            x1="0"
            x2="0"
            y1="0"
            y2="1"
            gradientTransform="rotate(0,0.5,0.5)">
            <stop offset="0" stop-color="#92EEFF" />
            <stop offset="1" stop-color="#92EEFF" />
          </linearGradient>
        </defs>
        <pattern id="b" width="10" height="10" patternUnits="userSpaceOnUse">
          <circle fill="#FFFFFF" cx="5" cy="5" r="5" />
        </pattern>
        <rect width="100%" height="100%" fill="url(#a)" />
        <rect width="100%" height="100%" fill="url(#b)" fill-opacity="0.5" />
      </svg>
    </div>
    <div class="box-calc">
      <div class="box-display-border">
        <div class="box-display">
          <p>18 x 3 + 8</p>
          <p>62</p>
        </div>
      </div>
      <div class="box-buttons">
        <button class="key-btn">C</button>
        <button class="key-btn">+/-</button>
        <button class="key-btn">%</button>
        <button class="key-btn">&divide;</button>
        <button class="key-btn">7</button>
        <button class="key-btn">8</button>
        <button class="key-btn">9</button>
        <button class="key-btn">&times;</button>
        <button class="key-btn">4</button>
        <button class="key-btn">5</button>
        <button class="key-btn">6</button>
        <button class="key-btn">-</button>
        <button class="key-btn">1</button>
        <button class="key-btn">2</button>
        <button class="key-btn">3</button>
        <button class="key-btn">+</button>
        <button class="key-btn">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="26"
            height="26"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-delete preview-icon">
            <path
              d="M10 5a2 2 0 0 0-1.344.519l-6.328 5.74a1 1 0 0 0 0 1.481l6.328 5.741A2 2 0 0 0 10 19h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z" />
            <path d="m12 9 6 6" />
            <path d="m18 9-6 6" />
          </svg>
        </button>
        <button class="key-btn">0</button>
        <button class="key-btn">.</button>
        <button class="key-btn">=</button>
      </div>
    </div>
  </body>
</html>
